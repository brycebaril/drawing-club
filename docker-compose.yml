services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drawing_club
      POSTGRES_PASSWORD: drawing_club
      POSTGRES_DB: drawing_club
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image expects a single mount at
      # /var/lib/postgresql (it manages its own major-version-specific
      # subdirectory underneath) rather than the pre-18 convention of
      # mounting straight at /var/lib/postgresql/data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawing_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
