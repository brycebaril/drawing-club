name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # CI's `pnpm build`/e2e run under NODE_ENV=production like a real deploy
  # would, but this isn't one — without an explicit APP_ENV,
  # src/lib/envStatus.ts's fallback would otherwise treat it as production
  # and its test-mode Stripe key / unconfigured SES as a misconfiguration.
  APP_ENV: development
  DATABASE_URL: postgres://drawing_club:drawing_club@localhost:5432/drawing_club
  NEXTAUTH_SECRET: ci-placeholder-secret
  NEXTAUTH_URL: http://localhost:3000
  JOB_TRIGGER_SECRET: ci-placeholder-secret
  # Not real keys — just enough for src/lib/stripe/client.ts to construct
  # without throwing (it's imported eagerly by the wallet actions and the
  # webhook route, so `pnpm build` fails outright without these set) and for
  # e2e/payments.spec.ts's webhook tests to sign requests locally.
  STRIPE_SECRET_KEY: sk_test_ci-placeholder-not-a-real-key
  STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder-not-a-real-secret

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: drawing_club
          POSTGRES_PASSWORD: drawing_club
          POSTGRES_DB: drawing_club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drawing_club"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Refresh tzdata
        # Worked around a real bug, not a defensive nicety: this runner
        # image's installed America/Los_Angeles zoneinfo (which
        # America/Vancouver is itself just a Link/alias to — renaming
        # ORG_TIMEZONE doesn't touch the underlying file, confirmed by
        # identical failures either way) computed the Nov 1 2026 DST
        # fall-back transition wrong: isdst flipped to 0 but gmtoff stayed
        # at -25200 (should become -28800) and the abbreviation showed MST
        # instead of PST, so every ORG_TIMEZONE-aware calculation landed an
        # hour off for the rest of that year. A fresh tzdata install fixes
        # the actual corrupted data at its source. The zdump line is a
        # cheap ongoing canary if this ever recurs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --reinstall tzdata
          zdump -v America/Los_Angeles | grep 2026 || true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # check-latest: without this, setup-node silently reuses whatever
          # patch of .nvmrc's major happens to be pre-cached on the runner
          # image, rather than the actual latest. amplify.yml's own prod
          # install already documents wanting "the newest patch on every
          # build" (security fixes); this makes CI match that.
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        # --config.node-linker=hoisted, matching amplify.yml's prod install:
        # output: "standalone" (next.config.ts) copies traced node_modules
        # files, and pnpm's default symlinked store doesn't survive that
        # copy (symlinks point at absolute install-machine paths) — the
        # e2e webServer step below builds+serves the real standalone
        # output, so it hits the exact packaging bug amplify.yml already
        # works around for the real Amplify deploy.
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Lint
        run: pnpm lint

      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm exec node-pg-migrate up

      - name: Seed test data
        run: pnpm exec tsx scripts/seed.ts

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
