name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # CI's `pnpm build`/e2e run under NODE_ENV=production like a real deploy
  # would, but this isn't one — without an explicit APP_ENV,
  # src/lib/envStatus.ts's fallback would otherwise treat it as production
  # and its test-mode Stripe key / unconfigured SES as a misconfiguration.
  APP_ENV: development
  DATABASE_URL: postgres://drawing_club:drawing_club@localhost:5432/drawing_club
  NEXTAUTH_SECRET: ci-placeholder-secret
  NEXTAUTH_URL: http://localhost:3000
  JOB_TRIGGER_SECRET: ci-placeholder-secret
  # Not real keys — just enough for src/lib/stripe/client.ts to construct
  # without throwing (it's imported eagerly by the wallet actions and the
  # webhook route, so `pnpm build` fails outright without these set) and for
  # e2e/payments.spec.ts's webhook tests to sign requests locally.
  STRIPE_SECRET_KEY: sk_test_ci-placeholder-not-a-real-key
  STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder-not-a-real-secret

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: drawing_club
          POSTGRES_PASSWORD: drawing_club
          POSTGRES_DB: drawing_club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drawing_club"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm exec node-pg-migrate up

      - name: Seed test data
        run: pnpm exec tsx scripts/seed.ts

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
